<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanji Flashcard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hina+Mincho&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
</head>
<body>
    <header>
        <div class="header_inner">
            <h1>漢字フラッシュカード</h1>
        </div>
    </header>
    <main>
        <div class="center_wrap">
            <section class="dashboard_card">
                <div class="dashboard_header">
                    <div>
                        <h2>漢字 study</h2>
                        <p class="choose_deck_label">Choose a deck</p>
                    </div>
                    <div class="header_right">
                        <div class="streak_badge"><span class="streak_count">0</span> day streak</div>
                    </div>
                </div>

                <div class="deck_card">
            <button class="kanji_deck">
                <h2>
                    漢字
                </h2>
                <p>N5 Kanji</p>
                <div class="progress">
                    <div class="progress_track">
                        <div class="progress_fill" id="progress_fill_kanji"></div>
                    </div>
                    <div id="label_kanji">0/80</div>
                </div>
            </button>
            <button class="hiragana_deck">
                <h2>ひらがな</h2>
                <p>Hiragana</p>
                <div class="progress">
                    <div class="progress_track">
                        <div class="progress_fill" id="progress_fill_hiragana"></div>
                    </div>
                    <div id="label_hiragana">0/46</div>
                </div>
            </button>
            <button class="katakana_deck">
                <h2>カタカナ</h2>
                <p>Katakana</p>
                <div class="progress">
                    <div class="progress_track">
                        <div class="progress_fill" id="progress_fill_katakana"></div>
                    </div>
                    <div id="label_katakana">0/46</div>
                </div>
            </button>
            </div>

            <div class="daily_stat">
            <div class="total_review">
                <h2></h2>
                <p>cards reviewed</p>
            </div>
            <div class="daily_accuracy">
                <p class="score_acc"></p>
                <p>accuracy</p>
            </div>
                </div>
            </section>
        </div>

        <div class="container card_container">
            <div class="modal_panel">
                <div class="card_top">
                    <button class="button esc_btn">◀</button>
                    <div class="progress">
                        <div class="progress_track">
                            <div class="progress_fill" id="progress_fill"></div>
                        </div>
                    </div>
                    <div id="label">0/80</div>
                </div>

                <div class="card_inner" id="card_inner">
                    <div class="card front_card">
                        <button class="button hint_btn">show hint</button>
                        <div>
                            <p class="word" id="word_display_front">...</p>
                        </div>
                    </div>
                    <div class="card back_card">
                        <p class="word" id="word_display_back">...</p>
                        <p class="meaning" id="meaning_display"></p>
                        <p class="reading" id="reading_display"></p>
                    </div>
                </div>

                <div class="btn">
                    <button class="button ans_btn" id="prev_btn">previous</button>
                    <button class="button ans_btn" id="hard_btn">Don't know</button>
                    <button class="button ans_btn" id="good_btn">Know it</button>
                </div>
            </div>
        </div>
        <div class="container summary">
            <button class="button esc_btn">X</button>
            <p class="score"></p>
            <p class="accuracy">0/0</p>
        </div>
    </main>
</body>
</html>
